# mypy.ini — the type half of this package's gate, the counterpart to ruff.
#
# Added 2026-10-19, two and a half weeks after the other eight got it. The
# split that gave each brick its own repository gave six of them this file and
# missed these two, which is also why they had no pre-push hook: they pushed
# without checking anything, and nobody saw it because nothing was checking.
# The errors it found on the first run were all this file's own absence —
# `ignore_missing_imports` — which is the quiet kind of gap: no bug, no
# symptom, just a gate that was never there.
#
# Originally added 2026-10-02 elsewhere, after the gate's absence let a real defect through. The
# monorepo has carried this config since the skills lived there; when the
# packages were split out, ruff came with them and mypy did not. Running it by
# hand on all six found the same bug in all six at once: `mcp.py` defines
# `main` twice, in the `except ImportError` branch and in the `else`, and the
# two had different signatures, so `main(["--host", "..."])` answered on a
# machine with the `[mcp]` extra and raised `TypeError` on one without.
#
# Deliberately the same pragmatic settings as the monorepo, not `--strict`:
# full signatures are required, third-party stubs are not.
[mypy]
python_version = 3.10
# The local-AI and plotting paths lazily import heavy optional backends that
# are not in the light CI lane. Check the code's OWN annotations, not stubs.
ignore_missing_imports = True
warn_redundant_casts = True
# Every def carries a full signature — no untyped or partially-typed functions.
disallow_untyped_defs = True
disallow_incomplete_defs = True
# warn_unused_ignores stays OFF on purpose: with ignore_missing_imports,
# whether a `# type: ignore` on an optional-backend import is "used" depends on
# whether that dependency happens to be installed, so it fires falsely in CI
# while being correct in a dev environment where the backends are present.
#
# scripts/ is checked as its own invocation: the scripts add their own dir to
# sys.path at runtime and import siblings by bare name (`from _click import …`),
# which only resolves when that directory is the check's root.
