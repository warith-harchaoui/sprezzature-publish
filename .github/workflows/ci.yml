name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Cran d'arrêt, pas budget : sans lui GitHub laisse courir un job pendu
    # six heures. Aucun des dix dépôts n'en avait.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pyproject says >=3.10. Testing only the newest hides a module that
        # does not parse on the floor at all, for as long as it takes someone
        # to run it there.
      # UNE SEULE version de Python sous la suite complete. La matrice en
      # faisait tourner plusieurs, c'est-a-dire le meme travail multiplie par
      # autant de coureurs pour attraper des differences de version que les
      # tests ne regardent pas. Le plancher garde sa preuve : le job `floor`
      # installe et importe le paquet sur la plus ancienne version promise,
      # ce qui est la promesse faite a `pip install`, pour une fraction du
      # cout.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # Une fois, pas trois. ruff est un analyseur statique : son verdict ne
        # dépend pas de l'interpréteur, donc le lancer sur chaque version de la
        # matrice paie trois fois la même réponse. C'est le motif que les sept
        # autres briques appliquaient déjà à leur étape de lint ou de typage.
        if: matrix.python-version == '3.12'
        run: ruff check sprezzature_publish scripts tests

      # Nothing here needs Ollama or the network: the suite exercises the
      # document tools and reads what the surfaces declare. The LLM-output
      # quality suite is marked `eval` and excluded by default — in CI it
      # would skip every test and report green for work it never did.
      - name: Tests
        run: python -m pytest -q

  floor:
    name: Plancher (3.10 installe et importe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python` est une promesse faite a qui lance `pip install` : sur
    # cette version, le paquet s'installe et s'importe. Installer et importer,
    # deliberement pas la suite de tests — les tests ont le droit d'employer des
    # nouveautes de langage, et faire echouer le plancher la-dessus ferait
    # echouer un job pour une raison etrangere a la promesse.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import sprezzature_publish"
