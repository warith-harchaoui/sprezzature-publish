[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-publish"
version = "1.1.0"
description = "A folder of Markdown becomes a site somebody can find: pages, meta tags, a favicon set from one logo, the indexes crawlers and language models look for, and an optional narrated read-along."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["markdown", "static-site", "seo", "open-graph", "favicon", "sitemap", "llms-txt", "atom", "narration", "accessibility", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

# click, and nothing else.
#
# `sprezzature-publish` — the click front door — is a declared console
# script, and a command that `pip install` puts on PATH and that dies on
# `import click` is the defect sprezzature-ux-laws shipped once and
# sprezzature-vision nearly shipped again. Behind an extra it would be
# installed-but-broken by default; here it is ~100 kB of pure Python.
#
# Everything heavier stays an extra, named after the tool that needs it, so
# an install says what it is for — and so `sprezzature-publish-lint` reads
# Markdown with the standard library alone. That is what lets the lint sit in
# a pre-commit hook and a minimal CI container without an image library or a
# model client behind it.
dependencies = ["click>=8.1"]

[project.optional-dependencies]
# Markdown → HTML. `mmdc` renders the Mermaid diagrams a page may carry.
html = ["markdown>=3.5", "mmdc>=0.3"]
# The favicon and app-icon set, from one logo.
icons = ["Pillow>=10.0.0"]
# The lint's optional half: it checks that external links resolve and that
# Mermaid blocks parse, neither of which the stdlib can do.
lint = ["mmdc>=0.3", "requests>=2.31"]
# Meta tags and the plain-language rewrite both ask a local model.
prose = [
    "langdetect>=1.0.9",
    "requests>=2.31.0",
    # Every LLM call across sprezzature-* routes through this one function,
    # so no script here talks to Ollama directly.
    "best-engine-ai-helper>=1.4",
]
# Narration and the read-along. The *voices* are not here: synthesis lives in
# sprezzature-audio, which owns the sound modality in both directions, and is
# invoked as a subprocess so its heavy imports never enter this graph.
#
# 1.3.0 is the floor because that is where Kokoro arrives — the default
# engine, and the one that makes `[narrate]` mean an ONNX runtime rather than
# a torch install. On 1.2.0 this extra resolves and the default engine does
# not exist.
narrate = ["sprezzature-audio[narrate]>=1.3.0"]
# Everything, for someone building a whole site rather than one piece of one.
all = ["sprezzature-publish[html,icons,lint,prose]"]
# HTTP surface (sprezzature_publish/api.py).
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.0"]
# MCP surface: the same routes republished as agent tools.
mcp = [
    "sprezzature-publish[api]",
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4.0 declares mcp>=1.12.0 with no upper bound but calls
    # mcp's Server(name, description) positionally — mcp 2.0.0 made
    # `description` keyword-only, so an unconstrained resolve breaks
    # FastApiMCP(...) at construction. Pin below 2.0 until it ships a fix.
    # Same pin, same reason, as every sibling brick.
    "mcp<2.0",
]
dev = [
    "pytest>=8.0", "ruff", "mypy", "httpx>=0.27", "types-PyYAML",
    # tomllib landed in 3.11 and this package claims 3.10.
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
# One command per tool, named for the package so `pip install` puts something
# usable on PATH rather than a path that only exists inside a clone.
#
# The drafting tools are offered through both parsers, which is the house
# contract (SURFACES.md in the monorepo): `make-site` reads its flags with
# argparse, `sprezzature-publish` with click, and both call the same engine.
make-site = "sprezzature_publish.cli:main"
sprezzature-publish = "sprezzature_publish.cli_click:main"
sprezzature-publish-lint = "sprezzature_publish_scripts.lint_markdown:main"
sprezzature-publish-html = "sprezzature_publish_scripts.md_to_html:main"
sprezzature-publish-icons = "sprezzature_publish_scripts.favicons:main"
sprezzature-publish-indexes = "sprezzature_publish_scripts.site_indexes:main"
sprezzature-publish-meta = "sprezzature_publish_scripts.meta_from_ollama:main"
sprezzature-publish-plain = "sprezzature_publish_scripts.plain_language:main"
sprezzature-publish-changelog = "sprezzature_publish_scripts.changelog_feed:main"
sprezzature-publish-narrate = "sprezzature_publish_scripts.narrate_post:main"
sprezzature-publish-readalong = "sprezzature_publish_scripts.readalong:main"
sprezzature-publish-mcp = "sprezzature_publish.mcp:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-publish"
Changelog = "https://github.com/warith-harchaoui/sprezzature-publish/blob/main/CHANGELOG.md"
Issues = "https://github.com/warith-harchaoui/sprezzature-publish/issues"

[tool.setuptools]
# Two packages: the surfaces, and the original scripts under their own
# importable name. The scripts keep their folder because they import each
# other by bare name off a runtime sys.path — renaming it would mean
# rewriting every one of those imports for no gain.
packages = ["sprezzature_publish", "sprezzature_publish_scripts"]

[tool.setuptools.package-dir]
"sprezzature_publish_scripts" = "scripts"

[tool.setuptools.package-data]
"sprezzature_publish_scripts" = ["prompts/*.yaml", "charters/*", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not eval"` keeps the LLM-output quality suite out of the default run:
# it needs a running Ollama and a pulled model, so in CI it would skip every
# test and report green for work it never did. Opt in with `pytest -m eval`.
addopts = '-ra -q --strict-markers -m "not eval"'
markers = [
    "eval: LLM-output quality tests under tests/eval/ (need Ollama running)",
    "network: tests that require network access",
    "slow: tests that take noticeable time",
]
