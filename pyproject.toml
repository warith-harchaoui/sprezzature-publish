[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-publish"
version = "1.7.0"
description = "A folder of Markdown becomes a site somebody can find: pages, meta tags, a favicon set from one logo, the indexes crawlers and language models look for, and an optional narrated read-along."
readme = "README.md"
# `<3.14` since 2026-11-01, when the extras were folded into the base. The
# ceiling is not this package's own: it arrives through base dependencies that
# declare it at the versions named below. While they sat behind an extra the
# base resolved on 3.14 and a reader who installed nothing optional was not
# refused the interpreter; one `pip install` means the ceiling is the
# package's, so the package declares it rather than handing out
# `ERROR: Could not find a version that satisfies the requirement`.
#
# The hub's own guard dictated this edit, by name and with the fix:
# tests/test_no_brick_promises_a_python_its_dependencies_exclude.py.
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["markdown", "static-site", "seo", "open-graph", "favicon", "sitemap", "llms-txt", "atom", "narration", "accessibility", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

# click, and nothing else.
#
# `sprezzature-publish` — the click front door — is a declared console
# script, and a command that `pip install` puts on PATH and that dies on
# `import click` is the defect sprezzature-ux-laws shipped once and
# sprezzature-vision nearly shipped again. Behind an extra it would be
# installed-but-broken by default; here it is ~100 kB of pure Python.
#
# Everything heavier was an extra until 2026-11-01 and is in the base below
# now, but `sprezzature-publish-lint` still reads Markdown with click and the
# standard library alone: it never imports the rest. That is what lets the
# lint sit in a pre-commit hook without an image library or a model client
# behind it.
dependencies = [
    "click>=8.1",

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 1
    # dependency, so `pip install sprezzature-publish` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "markdown>=3.5",
    "Pillow>=10.0.0",
    "requests>=2.31",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
    # Plain, and 1.9.0, since 2026-11-01. It asked for
    # the sibling with an extra while the index served 1.5.0, where that
    # extra was the real thing and the base had no voice. 1.9.0 folded
    # every extra into the base, so the name is now an empty deprecated shim
    # kept alive only for this line and its twin in the other sibling.
    #
    # The floor is load-bearing in the exact way a floor should be: on 1.5.0
    # this plain requirement would install a package that cannot speak, and
    # pip would say nothing — an unknown extra is a warning and exit 0,
    # measured, so neither spelling fails loudly on the wrong version.
    "sprezzature-audio>=1.9.0",
    "langdetect>=1.0.9",
    # 1.11.0 is the first whose `chat()` takes `engine=`, which is how every
    # call here reaches the server `OLLAMA_URL` names rather than its own
    # default; on 1.10 the argument is a TypeError at the first model call.
    "best-engine-ai-helper>=1.11.0",
    # The floor is 1.3.2 and it is load-bearing. Up to and including 1.3.1,
    # `SqliteLedger.__init__` ran `PRAGMA journal_mode=WAL`, which needs
    # exclusive access to the file, and SQLite answers a journal-mode change
    # with SQLITE_BUSY *without consulting the busy handler* -- so the
    # connection's timeout did not cover it. Six processes onto one missing
    # database file collided in two of six rounds, which is the shape
    # `scripts/_wallet.py` documents.
    #
    # `scripts/_wallet.py`'s retry stays, and this floor is what lets its prose
    # say what it is really for: a file that is not a database, which is a disk
    # and not a release. Raising the floor removed the cause, not the defence.
    "wallet-helper>=1.3.2,<2",
    # Read by name since 1.4.0: `ctas.yaml`, YAML data files on a site, the
    # prompts. It arrived only transitively before, through best-engine, and
    # a dependency nobody declares disappears the day the other one drops it.
    "pyyaml>=6",
]

[project.optional-dependencies]
# This extra cannot be installed on **3.14** or later, and the base install
# can. The ceiling arrives through `sprezzature-audio>=1.9.0`, which declares
# `requires-python <3.14,>=3.10` where the 1.5.0 this used to name declared
# `>=3.10` and no upper bound — the quiet half of a floor move, and harmless
# here only because this package already promises `>=3.10,<3.14`.
#
# Said out loud because the base install is unaffected, which is exactly why
# nothing else would ever catch it.
dev = [
    # The sibling that owns the voice, *base install only* — no extra,
    # whose backends are the weight this package keeps out of its graph on
    # purpose. `tests/test_narrate.py` checks that the engine command built
    # here names a module that exists over there; its own docstring says the
    # check "passed on every developer's laptop and failed on the one
    # environment that installs nothing extra". It skipped there rather than
    # failing, which is the same silence.
    #
    # The sentence that stood here — "the base install is `click` and
    # `langdetect`" — was true of `sprezzature-audio` 1.5.0 and stopped being
    # true on 2026-11-01, when 1.9.0 folded every extra into the base. The
    # floor says 1.9.0 so the test runs against the package the base
    # dependency names, and not a version where the voice lived behind an
    # extra this list does not ask for.
    #
    # It brings a ceiling with it: 1.9.0 declares `requires-python
    # <3.14,>=3.10` where 1.5.0 declared `>=3.10` and no upper bound. So this
    # extra cannot be installed on **3.14** or later. That matches what this
    # package promises, and it is said here because the base install is
    # unaffected — which is exactly why nothing else would catch it.
    "sprezzature-audio>=1.9.0",
    "pytest>=8.0", "ruff", "mypy", "httpx>=0.27", "types-PyYAML",
    # starlette 1.9 moved its TestClient onto httpx2; tests/test_api_site_routes.py
    # uses it, and a runner resolving a current starlette would go red without it.
    "httpx2>=2.0.0",
    # tomllib landed in 3.11 and this package claims 3.10.
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
sprezzature-publish-skill = "sprezzature_publish._skill:main"
# One command per tool, named for the package so `pip install` puts something
# usable on PATH rather than a path that only exists inside a clone.
#
# `make-site` and `sprezzature-publish` are two spellings of one click front
# door. Every command below is click too, the MCP server included, since
# 2026-11-04: no argparse anywhere (tests/test_every_command_is_click.py).
make-site = "sprezzature_publish.cli:main"
sprezzature-publish = "sprezzature_publish.cli:main"
sprezzature-publish-lint = "sprezzature_publish_scripts.lint_markdown:main"
sprezzature-publish-audit = "sprezzature_publish_scripts.audit_site:main"
sprezzature-publish-cta = "sprezzature_publish_scripts.cta:main"
sprezzature-publish-faq = "sprezzature_publish_scripts.faq:main"
sprezzature-publish-findable = "sprezzature_publish_scripts.findable:main"
sprezzature-publish-html = "sprezzature_publish_scripts.md_to_html:main"
sprezzature-publish-icons = "sprezzature_publish_scripts.favicons:main"
sprezzature-publish-indexes = "sprezzature_publish_scripts.site_indexes:main"
sprezzature-publish-meta = "sprezzature_publish_scripts.meta_from_ollama:main"
sprezzature-publish-plain = "sprezzature_publish_scripts.plain_language:main"
sprezzature-publish-changelog = "sprezzature_publish_scripts.changelog_feed:main"
sprezzature-publish-narrate = "sprezzature_publish_scripts.narrate_post:main"
sprezzature-publish-readalong = "sprezzature_publish_scripts.readalong:main"
sprezzature-publish-mcp = "sprezzature_publish.mcp:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-publish"
Changelog = "https://github.com/warith-harchaoui/sprezzature-publish/blob/main/CHANGELOG.md"
Issues = "https://github.com/warith-harchaoui/sprezzature-publish/issues"

[tool.setuptools]
# Two packages: the surfaces, and the original scripts under their own
# importable name. The scripts keep their folder because they import each
# other by bare name off a runtime sys.path — renaming it would mean
# rewriting every one of those imports for no gain.
packages = ["sprezzature_publish", "sprezzature_publish_scripts"]

[tool.setuptools.package-dir]
"sprezzature_publish_scripts" = "scripts"

[tool.setuptools.package-data]
# The skill an agent reads ships inside the package, so `pip install`
# carries all five surfaces; `sprezzature-publish-skill --install` puts it
# where Claude Code or OpenCode looks.
"sprezzature_publish" = ["skill/**/*"]
"sprezzature_publish_scripts" = ["prompts/*.yaml", "charters/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not eval"` keeps the LLM-output quality suite out of the default run:
# it needs a running Ollama and a pulled model, so in CI it would skip every
# test and report green for work it never did. Opt in with `pytest -m eval`.
# No `-q` here, on purpose. `-q` in `addopts` plus the `-q` a human types --
# or the one the pre-push hook passes -- is `-qq`, and at that verbosity pytest
# drops its last line: the run ends on the progress bar with no "N passed" at
# all. Four of the ten repositories were in that state, so `pytest -q` gave a
# verdict in six of them and a silence in four. Failures still printed, so
# nothing was ever wrong; a run that will not say what it did is still the
# wrong default for a suite whose whole argument is that a check must speak.
addopts = '-ra --strict-markers -m "not eval"'
markers = [
    "eval: LLM-output quality tests under tests/eval/ (need Ollama running)",
    "network: tests that require network access",
    "slow: tests that take noticeable time",
]
