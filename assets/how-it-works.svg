<svg xmlns="http://www.w3.org/2000/svg" width="980" height="985" viewBox="0 0 980 985" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="publish-hiw-title publish-hiw-desc"><title id="publish-hiw-title">How sprezzature-publish works</title><desc id="publish-hiw-desc">Flow diagram. At the top, a README, a docs folder, a changelog and one logo feed two lanes. The left lane makes: it renders the pages, turns the logo into a full icon set, writes the indexes crawlers and language models look for, and narrates the text with a local voice bound to the page. The right lane audits: it lints the Markdown before anything renders it, reads the built site or a live URL back, and cites a specification for every rule. Both meet in one outcome, a site a search engine, a language model and a reader can each find their way through.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="985" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">How sprezzature-publish works</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">A folder of Markdown becomes a site somebody can find.</text><rect x="36" y="104" width="908" height="85" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">A README, a docs folder, a changelog, one logo</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">sized for a site you can hold in your head. For a hundred versioned pages, reach for MkDocs Material, Hugo or Astro: this does not</text><text x="54" y="174" font-size="13.5" font-weight="400" fill="#6E6E73">compete with them and says so.</text><path d="M490,189 V209 H254 V221" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,221 L254,229 L258,221" fill="#C7C7CC"/><path d="M490,189 V209 H726 V221" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,221 L726,229 L730,221" fill="#C7C7CC"/><rect x="36" y="229" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,237 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="250" font-size="15" font-weight="700" fill="#1D1D1F">Make: the site</text><rect x="36" y="275" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="304" font-size="16" font-weight="600" fill="#1D1D1F">Render the pages</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">Markdown to standalone HTML, with Mermaid diagrams drawn</text><text x="54" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">rather than left as code</text><path d="M254,360 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,376 L254,384 L258,376" fill="#C7C7CC"/><rect x="36" y="384" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="413" font-size="16" font-weight="600" fill="#1D1D1F">One logo becomes the whole icon set</text><text x="54" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">favicon, Apple touch icons, progressive-web-app icons,</text><text x="54" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">and the head snippet that references them</text><path d="M254,469 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,485 L254,493 L258,485" fill="#C7C7CC"/><rect x="36" y="493" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="522" font-size="16" font-weight="600" fill="#1D1D1F">Write what crawlers and models look for</text><text x="54" y="546" font-size="13.5" font-weight="400" fill="#6E6E73">robots.txt, sitemap.xml, llms.txt, llms-full.txt, an Atom feed,</text><text x="54" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">humans.txt</text><path d="M254,578 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,594 L254,602 L258,594" fill="#C7C7CC"/><rect x="36" y="602" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="631" font-size="16" font-weight="600" fill="#1D1D1F">Narrate it, and bind the reading to the page</text><text x="54" y="655" font-size="13.5" font-weight="400" fill="#6E6E73">a local voice, cues timed to the audio, and the sentence being</text><text x="54" y="672" font-size="13.5" font-weight="400" fill="#6E6E73">spoken highlighted as it is read</text><path d="M254,687 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,703 L254,711 L258,703" fill="#C7C7CC"/><rect x="36" y="711" width="436" height="68" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,723 v44" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="740" font-size="16" font-weight="600" fill="#1D1D1F">A folder you can deploy</text><text x="65" y="764" font-size="13.5" font-weight="400" fill="#6E6E73">pages, icons, indexes, a feed, and an MP3 beside its WebVTT</text><rect x="508" y="229" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,237 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="250" font-size="15" font-weight="700" fill="#1D1D1F">Audit: before it exists, and after</text><rect x="508" y="275" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="304" font-size="16" font-weight="600" fill="#1D1D1F">Lint the Markdown first</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">before anything renders it. Standard library, milliseconds,</text><text x="526" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">pre-commit shaped.</text><path d="M726,360 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,376 L726,384 L730,376" fill="#C7C7CC"/><rect x="508" y="384" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="413" font-size="16" font-weight="600" fill="#1D1D1F">Read the built site back</text><text x="526" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">head meta, Open Graph, icon links, robots.txt, sitemap.xml,</text><text x="526" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">llms.txt. A directory, a single page, or a live URL, with no</text><text x="526" y="472" font-size="13.5" font-weight="400" fill="#6E6E73">Markdown source required.</text><path d="M726,486 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,502 L726,510 L730,502" fill="#C7C7CC"/><rect x="508" y="510" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="540" font-size="16" font-weight="600" fill="#1D1D1F">Cite a specification, or say there is none</text><text x="526" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">WHATWG HTML, RFC 6596, RFC 9309, sitemaps.org 0.9,</text><text x="526" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">ogp.me, JSON-LD 1.1, RFC 4287, llmstxt.org. Where no such</text><text x="526" y="598" font-size="13.5" font-weight="400" fill="#6E6E73">document exists the rule says so instead of pretending.</text><path d="M726,613 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,629 L726,637 L730,629" fill="#C7C7CC"/><rect x="508" y="668" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,680 v78" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="697" font-size="16" font-weight="600" fill="#1D1D1F">Findings, and the repairs that follow from the page</text><text x="537" y="721" font-size="13.5" font-weight="400" fill="#6E6E73">--fix writes back what can be derived. Anything a model</text><text x="537" y="738" font-size="13.5" font-weight="400" fill="#6E6E73">would have to invent is reported, not written, and on a remote</text><text x="537" y="756" font-size="13.5" font-weight="400" fill="#6E6E73">URL nothing is repaired at all.</text><path d="M254,778 V800 H490 V812" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,812 L490,820 L494,812" fill="#C7C7CC"/><path d="M726,778 V800 H490 V812" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,812 L490,820 L494,812" fill="#C7C7CC"/><rect x="36" y="820" width="908" height="85" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,832 v61" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="850" font-size="16" font-weight="600" fill="#1D1D1F">A site a search engine, a language model and a reader can each find their way through</text><text x="65" y="874" font-size="13.5" font-weight="400" fill="#6E6E73">The voices are not here. Narration synthesis lives in sprezzature-audio, which owns that modality in both directions, and is invoked</text><text x="65" y="891" font-size="13.5" font-weight="400" fill="#6E6E73">as a subprocess so its heavy imports never enter this dependency graph.</text><text x="36" y="932" font-size="13.5" font-weight="400" fill="#6E6E73">The lint has no dependencies at all, which is what makes it worth a pre-commit hook. Everything heavier is an extra named after the tool that</text><text x="36" y="949" font-size="13.5" font-weight="400" fill="#6E6E73">needs it, so an install says what it is for.</text></svg>
