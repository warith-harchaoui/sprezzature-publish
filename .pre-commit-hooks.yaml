# Pre-commit hook manifest for sprezzature-publish.
#
# Consumers add this repo to their own ``.pre-commit-config.yaml``:
#
#   repos:
#     - repo: https://github.com/warith-harchaoui/sprezzature-publish
#       rev: v1.4.1
#       hooks:
#         - id: sprezzature-publish-lint
#
# The lint needs click and the standard library only, which is the whole
# reason it belongs in a hook: it runs in milliseconds with nothing heavy
# behind it. Its optional halves stay off unless asked for: --render-mermaid
# renders each Mermaid block through mmdc, and --ai asks a local model for
# suggestions. A hook that did either on every commit would not be a hook
# anyone keeps. It never reaches the network: links are checked on disk.

- id: sprezzature-publish-lint
  name: sprezzature-publish — Markdown lint (heading order, code-fence languages, local links, LaTeX, Mermaid)
  description: >-
    Lints Markdown for heading order (MD001), trailing whitespace
    (MD009), code-fence languages (MD040), image alt text (MD045),
    local link freshness (MD050), LaTeX balance and Mermaid block
    syntax. Add --fix in your hook args for the safe auto-repairs.
  entry: sprezzature-publish-lint
  language: python
  language_version: python3
  files: '\.(md|mdx|mermaid|mmd)$'
  types: [file]
