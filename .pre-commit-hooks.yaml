# Pre-commit hook manifest for sprezzature-publish.
#
# Consumers add this repo to their own ``.pre-commit-config.yaml``:
#
#   repos:
#     - repo: https://github.com/warith-harchaoui/sprezzature-publish
#       rev: v1.4.1
#       hooks:
#         - id: sprezzature-publish-lint
#
# The lint needs click and the standard library only, which is the whole
# reason it belongs in a hook: it runs in milliseconds with nothing heavy
# behind it. Its optional half stays off unless asked for: --ai asks a local
# model for suggestions, and a hook that did that on every commit would not be
# a hook anyone keeps. It never reaches the network: links are checked on disk.

- id: sprezzature-publish-lint
  name: sprezzature-publish — Markdown lint (heading order, code-fence languages, local links, LaTeX)
  description: >-
    Lints Markdown for heading order (MD001), trailing whitespace
    (MD009), code-fence languages (MD040), image alt text (MD045),
    local link freshness (MD050) and LaTeX balance, and warns on a
    Mermaid block (MMD001: redraw it with sprezzature-figures). Add
    --fix in your hook args for the safe auto-repairs.
  entry: sprezzature-publish-lint
  language: python
  language_version: python3
  files: '\.(md|mdx)$'
  types: [file]
